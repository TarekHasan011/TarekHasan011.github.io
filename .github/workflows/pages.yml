# Publishes the site/ folder to GitHub Pages.
#
#  * On every push to main: deploy the site as it is.
#  * Once a day (and on demand from the Actions tab): first refresh the Google
#    Scholar data, journal metrics and abstracts with refresh_data.py, commit
#    any changes to site/data/, then deploy.

name: Update data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 0 * * *"   # every day at 00:30 UTC (06:30 in Dhaka)
  workflow_dispatch:

permissions:
  contents: write   # commit refreshed data
  pages: write      # deploy to GitHub Pages
  id-token: write   # required by the Pages deployment

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    # Pushes only redeploy; the data refresh runs on the daily schedule or manually.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Refresh Scholar data, journal metrics and abstracts
        env:
          # Optional: add a repository secret named ELSEVIER_API_KEY for live Scopus quartiles.
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
        run: python refresh_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Daily data refresh"
            git push
          fi

  deploy:
    needs: refresh
    # Run after a successful refresh, or straight away on a push (when refresh is skipped).
    if: always() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # includes the data commit made by the refresh job

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
